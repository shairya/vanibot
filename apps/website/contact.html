<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book a demo · vanibot</title>
<meta name="description" content="Book a vanibot demo for your business." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='16' r='10' fill='%230f766e'/%3E%3Ccircle cx='24' cy='16' r='5' fill='%23f59e0b'/%3E%3C/svg%3E" />
<script type="module" src="/src/main.ts"></script>
</head>
<body data-page="contact">
<main><section><div class="wrap">
  <h1>Book a demo</h1>
  <p class="muted" style="max-width:600px">Tell us about your business. We will show you vanibot working with your own information, and set up a free pilot if it is a fit.</p>
  <form id="demo-form" class="contact" style="margin-top:24px">
    <div><label for="name">Your name</label><input id="name" name="name" required maxlength="120" autocomplete="name" /></div>
    <div><label for="company">Company</label><input id="company" name="company" required maxlength="160" autocomplete="organization" /></div>
    <div><label for="email">Work email</label><input id="email" name="email" type="email" required maxlength="200" autocomplete="email" /></div>
    <div><label for="phone">Phone / WhatsApp (optional)</label><input id="phone" name="phone" maxlength="30" autocomplete="tel" /></div>
    <div><label for="interest">Interested in</label>
      <select id="interest" name="interest"><option value="chat_voice">Chat + voice</option><option value="chat">Chat only</option><option value="voice">Voice only</option><option value="not_sure">Not sure yet</option></select></div>
    <div><label for="message">What should the assistant help with? (optional)</label><textarea id="message" name="message" maxlength="2000"></textarea></div>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
    <div><button class="btn" type="submit">Request a demo</button> <span class="status" role="status"></span></div>
    <p class="muted small">We use these details only to contact you about vanibot. See our <a href="/privacy.html">privacy notice</a>.</p>
  </form>
</div></section></main>
</body>
</html>
